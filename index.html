<div class="hours-container">
                <table class="hours-table" id="hoursTable">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>اسم المهمة / المشروع</th>
                            <th>عدد الساعات (يدوي)</th>
                            <th>الأجر (10€ / ساعة)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="date" class="hours-input"></td>
                            <td><input type="text" class="hours-input" placeholder="اكتب وصف العمل..."></td>
                            <td><input type="number" step="0.5" class="hours-input hours-field" placeholder="0" oninput="calculateTotal()"></td>
                            <td class="pay-cell">€0.00</td>
                        </tr>
                        <tr>
                            <td><input type="date" class="hours-input"></td>
                            <td><input type="text" class="hours-input" placeholder="اكتب وصف العمل..."></td>
                            <td><input type="number" step="0.5" class="hours-input hours-field" placeholder="0" oninput="calculateTotal()"></td>
                            <td class="pay-cell">€0.00</td>
                        </tr>
                        <tr>
                            <td><input type="date" class="hours-input"></td>
                            <td><input type="text" class="hours-input" placeholder="اكتب وصف العمل..."></td>
                            <td><input type="number" step="0.5" class="hours-input hours-field" placeholder="0" oninput="calculateTotal()"></td>
                            <td class="pay-cell">€0.00</td>
                        </tr>
                    </tbody>
                </table>
                <button class="add-row-btn" onclick="addRow()">+ إضافة صف جديد يدوياً</button>
                <div class="totals" id="totalSummary">
                    إجمالي الساعات: 0 ساعات | الإجمالي الكلي: €0.00
                </div>
            </div>
        </div>

    </div>

    <script>
        // Switch between sidebar sections smoothly
        function switchSection(sectionId, element) {
            document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            element.classList.add('active');
        }

        // Calculate hours and total pay dynamically
        function calculateTotal() {
            let inputs = document.querySelectorAll('.hours-field');
            let totalHours = 0;
            
            inputs.forEach((input, index) => {
                let val = parseFloat(input.value) || 0;
                totalHours += val;
                let payCells = document.querySelectorAll('.pay-cell');
                if(payCells[index]) {
                    payCells[index].innerText = '€' + (val * 10).toFixed(2);
                }
            });

            let totalPrice = totalHours * 10;
            document.getElementById('totalSummary').innerText = إجمالي الساعات: ${totalHours} ساعات | الإجمالي الكلي: €${totalPrice.toFixed(2)};
        }

        // Add new row to hours table
        function addRow() {
            let table = document.getElementById('hoursTable').getElementsByTagName('tbody')[0];
            let newRow = table.insertRow();
            newRow.innerHTML = 
                <td><input type="date" class="hours-input"></td>
                <td><input type="text" class="hours-input" placeholder="اكتب وصف العمل..."></td>
                <td><input type="number" step="0.5" class="hours-input hours-field" placeholder="0" oninput="calculateTotal()"></td>
                <td class="pay-cell">€0.00</td>
            ;
        }
    </script>
</body>
</html>
